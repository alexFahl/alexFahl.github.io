<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Fahloune | Portfolio</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #060709;
      --bg-surface: rgba(13, 16, 23, 0.45);
      --border-color: rgba(255, 255, 255, 0.07);
      --border-hover: rgba(255, 255, 255, 0.15);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-dim: #64748b;

      /* Palette Premium Cyber-Minimalist */
      --accent-cyan: #38bdf8;
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
      --accent-indigo: #818cf8;
      --accent-rose: #f43f5e;
      
      /* Transitions optimisées */
      --transition-smooth: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
      --transition-bounce: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease, color 0.3s ease;
      
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }

    /* THEME CLAIR */
    body.light-mode {
      --bg-base: #f0f4f8;
      --bg-surface: rgba(255, 255, 255, 0.65);
      --border-color: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(0, 0, 0, 0.15);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-dim: #94a3b8;
    }

    body.light-mode .bg-ambient { background: radial-gradient(circle at 50% 50%, #e2e8f0 0%, #cbd5e1 100%); }
    body.light-mode .orb { opacity: 0.6; }
    body.light-mode .bg-grid {
      background-image: 
        linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
    }
    
    body.light-mode h2.section-heading { background: linear-gradient(135deg, #0f172a 30%, #64748b 100%); -webkit-background-clip: text; }
    body.light-mode .hero-name { background: linear-gradient(to right, #0f172a, #334155, #64748b); -webkit-background-clip: text; }
    body.light-mode .timeline-role, body.light-mode .skill-category-title, body.light-mode .project-title, body.light-mode .contact-icon-box { color: #0f172a; }
    body.light-mode .premium-card { box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.1); }
    body.light-mode .premium-card:hover { box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
    body.light-mode .nav-arrow { background: #111111; color: #ffffff; border-color: rgba(0, 0, 0, 0.5); box-shadow: 0 5px 15px rgba(0,0,0,0.25); }
    body.light-mode .nav-arrow:hover { background: #000000; color: #ffffff; border-color: #000000; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); }


    body.light-mode .dock-container {
      background: rgba(15, 17, 22, 0.9);
      border-color: rgba(0, 0, 0, 0.8);
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    body.light-mode .dock-btn { background: rgba(40, 42, 48, 0.8); color: #f8fafc; border-color: rgba(255, 255, 255, 0.05); }
    body.light-mode .dock-btn:hover, body.light-mode .dock-btn.is-active { background: #ffffff; color: #000000; }
    body.light-mode .dock-separator { background: rgba(255, 255, 255, 0.2); }
    body.light-mode .dock-btn::after { background: #ffffff; color: #000000; }

    /* Règles de base */
    * { box-sizing: border-box; margin: 0; padding: 0; cursor: none !important; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-base);
      color: var(--text-primary); overflow: hidden; height: 100vh; width: 100vw;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* === CURSEUR GÉANT === */
    .cursor-pointer {
      position: fixed; top: 0; left: 0; width: 44px; height: 44px; pointer-events: none; z-index: 9999; margin: -2px 0 0 -2px;
    }
    .cursor-pointer svg {
      width: 100%; height: 100%; fill: #ffffff; stroke: #060709; stroke-width: 2px; stroke-linejoin: round;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); transition: fill 0.4s ease, stroke 0.4s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: 2px 2px;
    }
    body.light-mode .cursor-pointer svg { fill: #0f172a; stroke: #ffffff; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); }
    body:has(a:hover, button:hover, .dock-btn:hover, .nav-arrow:hover) .cursor-pointer svg { transform: scale(0.85); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    .bg-ambient {
      position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
      background: radial-gradient(circle at 50% 50%, #0a0c10 0%, #050608 100%); transform: translateZ(0); transition: background 0.3s ease;
    }
    .orb { position: absolute; border-radius: 50%; opacity: 0.8; will-change: transform; animation: drift 30s ease-in-out infinite alternate; transform: translateZ(0); pointer-events: none; }
    .orb-1 { top: -10%; left: 10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(129, 140, 248, 0.25) 0%, rgba(129, 140, 248, 0) 60%); }
    .orb-2 { bottom: -10%; right: 5%; width: 45vw; height: 45vw; background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(56, 189, 248, 0) 60%); animation-delay: -5s; }
    .orb-3 { top: 40%; left: 60%; width: 35vw; height: 35vw; background: radial-gradient(circle, rgba(244, 63, 94, 0.2) 0%, rgba(244, 63, 94, 0) 60%); animation-delay: -10s; }

    @keyframes drift { 0% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(2%, 3%, 0) scale(1.05); } 100% { transform: translate3d(-1%, -2%, 0) scale(0.95); } }

    .bg-grid {
      position: fixed; inset: 0; z-index: -1;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 60px 60px; mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 40%, transparent 100%); transform: translateZ(0); pointer-events: none;
    }

    .carousel-wrapper {
      display: flex; width: 100vw; height: 100vh; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none;
      -webkit-overflow-scrolling: touch; transform: translateZ(0);
    }
    .carousel-wrapper::-webkit-scrollbar { display: none; }

    .slide-section {
      flex: 0 0 100vw; width: 100vw; height: 100vh; scroll-snap-align: center; display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
      padding: 100px 10vw 140px; overflow-y: auto; position: relative;
    }
    .slide-content { width: 100%; max-width: 1100px; opacity: 0; transform: translate3d(0, 20px, 0); transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); margin-top: 0; margin-bottom: auto; }
    .slide-section.active-slide .slide-content { opacity: 1; transform: translate3d(0, 0, 0); }

    /* ========================================================= */
    /* === NOUVEL ACCUEIL : DASHBOARD LAYOUT === */
    /* ========================================================= */
    
    .home-wrapper {
      width: 100%; max-width: 1100px; margin: 0 auto;
    }

    .home-dashboard {
      display: flex; flex-direction: column; gap: 1.5rem; width: 100%;
    }

    /* Ligne du Haut : Hero + Boutons Profil/Contact */
    .home-top-row {
      display: flex; gap: 1.5rem; width: 100%; align-items: stretch;
    }

    .home-hero-panel {
      flex: 1; display: flex; align-items: center;
    }

    .home-side-actions {
      display: flex; flex-direction: column; gap: 1.5rem; width: 180px; flex-shrink: 0;
    }

    .home-action-btn {
      flex: 1; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 24px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; cursor: none !important;
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
    }
    .home-action-btn i { font-size: 2rem; color: var(--text-secondary); transition: all 0.4s ease; }
    .home-action-btn span { font-family: 'Space Grotesk', sans-serif; font-size: clamp(0.95rem, 2.5vw, 1.1rem); font-weight: 700; color: var(--text-secondary); transition: all 0.4s ease; }
    
    .home-action-btn:hover {
      background: rgba(255, 255, 255, 0.05); border-color: var(--accent-indigo); transform: translateY(-4px) scale(1.02); box-shadow: 0 20px 40px -10px rgba(129, 140, 248, 0.2);
    }
    .home-action-btn:hover i { color: var(--accent-indigo); transform: translateY(-3px); }
    .home-action-btn:hover span { color: #fff; }

    /* Ligne du Bas : Flex Fixe */
    .home-expand-row {
      display: flex; gap: 1.5rem; height: 220px; width: 100%;
    }

    .home-expand-card {
      flex: 1; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 24px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: relative; overflow: hidden;
      cursor: none !important; 
      transition: background-color 0.4s ease, border-color 0.4s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
      display: flex; justify-content: center; align-items: center;
    }
    .home-expand-card:hover {
      border-color: var(--accent-cyan); background: rgba(255, 255, 255, 0.05); transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(56, 189, 248, 0.2);
    }

    .expand-content-wrapper {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; width: 100%;
    }

    .expand-icon { font-size: 2.5rem; color: var(--text-secondary); transition: color 0.4s ease, transform 0.4s ease; }
    .home-expand-card:hover .expand-icon { color: var(--accent-cyan); transform: translateY(-5px); }

    .expand-title {
      font-family: 'Space Grotesk', sans-serif; font-size: clamp(1rem, 2.5vw, 1.2rem); font-weight: 700; color: var(--text-secondary);
      white-space: nowrap; transition: color 0.4s ease;
    }
    .home-expand-card:hover .expand-title { color: #fff; }

    /* Light Mode du Dashboard Accueil */
    body.light-mode .home-action-btn, body.light-mode .home-expand-card {
      background: rgba(255, 255, 255, 0.7); border-color: rgba(0, 0, 0, 0.08); box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }
    body.light-mode .home-action-btn:hover {
      background: #ffffff; border-color: var(--accent-indigo); box-shadow: 0 20px 40px -10px rgba(129, 140, 248, 0.3);
    }
    body.light-mode .home-action-btn:hover span, body.light-mode .home-action-btn:hover i { color: var(--accent-indigo); }
    body.light-mode .home-expand-card:hover {
      background: #ffffff; border-color: var(--accent-cyan); box-shadow: 0 20px 40px -10px rgba(56, 189, 248, 0.3);
    }
    body.light-mode .home-expand-card:hover .expand-title, body.light-mode .home-expand-card:hover .expand-icon { color: var(--accent-cyan); }
    body.light-mode .expand-title, body.light-mode .home-action-btn span { color: #0f172a; }

    /* ========================================================= */

    .nav-arrow {
      position: fixed; top: 50%; transform: translateY(-50%); width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #0a0c10; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; z-index: 900; transition: var(--transition-bounce); box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .nav-arrow:hover { color: #0a0c10; background: #ffffff; border-color: #ffffff; transform: translateY(-50%) scale(1.1); box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15); }
    .nav-arrow-left { left: 2vw; } .nav-arrow-right { right: 5vw; }

    h2.section-heading { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.9rem, 5vw, 2.8rem); font-weight: 700; letter-spacing: -0.03em; margin-bottom: 2.5rem; background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 14px; }
    h2.section-heading i { font-size: clamp(1.4rem, 3.5vw, 2rem); background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .premium-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 24px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 2.5rem; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3); transition: var(--transition-smooth); transform: translateZ(0); }
    .premium-card:hover { border-color: var(--border-hover); }

    /* Ensure the same hover translate+scale effect applies in dark mode */
    body:not(.light-mode) .premium-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 12px 30px -12px rgba(56, 189, 248, 0.06), 0 6px 18px rgba(0,0,0,0.35);
    }

    /* Apply the translate+scale effect only for specific sections */
    #skills .premium-card:hover,
    #education .premium-card:hover,
    #projects .premium-card:hover {
      transform: translate3d(0, -2px, 0) scale(1.07);
    }

    .hero-container { display: flex; align-items: center; gap: 3.5rem; text-align: left; margin: 0; width: 100%; }
    .hero-avatar-wrapper { position: relative; flex-shrink: 0; }
    .hero-avatar-wrapper::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; background: conic-gradient(from 0deg, var(--accent-cyan), var(--accent-indigo), var(--accent-rose), var(--accent-cyan)); opacity: 0.3; filter: blur(6px); animation: spin 15s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hero-avatar { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; position: relative; z-index: 1; border: 4px solid var(--bg-base); transition: border-color 0.3s ease; }
    .hero-greet { font-size: clamp(0.95rem, 2.5vw, 1.15rem); font-weight: 500; color: var(--text-secondary); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .hero-name { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 700; line-height: 1; letter-spacing: -0.04em; margin-bottom: 1rem; background: linear-gradient(to right, #ffffff, #cbd5e1, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-role { font-size: clamp(1.15rem, 4vw, 1.6rem); font-weight: 600; color: var(--accent-cyan); margin-bottom: 1.5rem; }

    .badge-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .premium-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 100px; font-size: 0.85rem; font-weight: 600; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); color: var(--text-primary); transition: background 0.3s, border-color 0.3s, color 0.3s ease; }
    .premium-badge i { color: var(--accent-cyan); }
    .premium-badge.status-available { color: var(--accent-emerald); border-color: rgba(52, 211, 153, 0.2); background: rgba(52, 211, 153, 0.05); }
    .premium-badge.status-available .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-emerald); box-shadow: 0 0 8px rgba(52, 211, 153, 0.5); animation: pulse 2.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.6; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.6; } }

    .premium-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
    .skill-category-card { position: relative; overflow: hidden; }
    .skill-category-title { font-size: clamp(1.05rem, 2.5vw, 1.2rem); font-weight: 700; margin-bottom: 1.5rem; color: #ffffff; display: flex; align-items: center; gap: 10px; transition: color 0.3s ease; }
    .skill-category-title i { color: var(--accent-indigo); }
    .skill-pool { display: flex; flex-wrap: wrap; gap: 8px; }
    
    .skill-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 12px; font-size: 0.85rem; font-weight: 500; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-secondary); transition: border-color 0.3s, color 0.3s; }
    .skill-tag i { font-size: 1.1rem; } 
    .skill-category-card:hover .skill-tag { border-color: rgba(255, 255, 255, 0.1); color: var(--text-primary); }

    .timeline-container { position: relative; padding-left: 5rem; }
    .timeline-container::before { content: ''; position: absolute; left: 39px; top: 0px; bottom: 0; width: 2px; background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-indigo), transparent); opacity: 0.3; }
    .timeline-node { position: relative; margin-bottom: 3rem; }
    .timeline-node:last-child { margin-bottom: 0; }
    .timeline-marker { position: absolute; left: calc(-3.5rem + 7px); top: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg-base); border: 3px solid var(--accent-cyan); z-index: 2; transition: transform 0.3s ease, border-color 0.3s ease, background-color 0.3s ease; }
    .timeline-node:hover .timeline-marker { transform: scale(1.2); border-color: var(--accent-rose); }
    .timeline-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 10px; }
    .timeline-date { font-size: 0.85rem; font-weight: 700; color: var(--accent-cyan); background: rgba(56, 189, 248, 0.06); padding: 4px 12px; border-radius: 100px; border: 1px solid rgba(56, 189, 248, 0.15); }
    .timeline-role { font-size: clamp(1.1rem, 3vw, 1.3rem); font-weight: 700; color: #ffffff; transition: color 0.3s ease; }
    .timeline-company { font-size: clamp(0.9rem, 2.2vw, 1rem); color: var(--text-secondary); font-weight: 500; margin-bottom: 0.75rem; }
    .timeline-desc { font-size: clamp(0.9rem, 2.2vw, 0.95rem); line-height: 1.6; color: var(--text-secondary); }
    .timeline-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    .timeline-list li { font-size: 0.9rem; line-height: 1.5; color: var(--text-secondary); display: flex; align-items: baseline; gap: 8px; }
    .timeline-list li i { font-size: 0.6rem; color: var(--accent-cyan); flex-shrink: 0; position: relative; top: -1px; }

    .project-card {
      display: flex; flex-direction: column; justify-content: space-between; height: 100%;
      cursor: none !important; position: relative; overflow: hidden;
      transition: var(--transition-smooth), border-color 0.3s ease, box-shadow 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .project-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 24px;
      background: linear-gradient(135deg, rgba(56,189,248,0.06) 0%, rgba(129,140,248,0.04) 100%);
      opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 0;
    }
    .project-card:hover::before { opacity: 1; }
    .project-card > * { position: relative; z-index: 1; }
    .project-card:hover {
      border-color: rgba(56,189,248,0.45) !important;
      box-shadow: 0 0 0 1px rgba(56,189,248,0.15), 0 20px 45px -15px rgba(56,189,248,0.25), inset 0 1px 0 rgba(255,255,255,0.07);
      transform: translate3d(0, -4px, 0) scale(1.02);
    }
    body.light-mode .project-card:hover {
      border-color: rgba(56,189,248,0.5) !important;
      box-shadow: 0 0 0 1px rgba(56,189,248,0.2), 0 20px 45px -15px rgba(56,189,248,0.2);
    }

    /* Click hint indicator */
    .project-card-click-hint {
      position: absolute; top: 1.4rem; right: 1.4rem; z-index: 2;
      width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.15);
      color: rgba(56,189,248,0.4); font-size: 0.75rem;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); opacity: 0; transform: scale(0.7);
    }
    .project-card:hover .project-card-click-hint {
      opacity: 1; transform: scale(1); color: var(--accent-cyan); background: rgba(56,189,248,0.12); border-color: rgba(56,189,248,0.35);
    }

    /* Project category badge */
    .project-badge {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 0.9rem;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 6px; line-height: 1;
    }
    .project-badge i { font-size: 0.7rem; }

    function ProjectModal({ project, onClose, isLightMode, lang }) {
      const [slideIndex, setSlideIndex] = React.useState(0);

      React.useEffect(() => {
        if (!project) return;
        const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [project, onClose]);

      React.useEffect(() => { setSlideIndex(0); }, [project]);

      const images = project ? (project.images || []) : [];
      const hasImages = images.length > 0;
      const video = project ? project.video : null;
      const goTo = (idx) => setSlideIndex((idx + images.length) % images.length);
      const isFr = lang === 'fr';

      return (
        <div className={`project-modal-overlay ${project ? 'is-open' : ''}`} onClick={onClose}>
          <div className="project-modal" onClick={(e) => e.stopPropagation()}>

            {/* Carousel */}
            <div className="modal-carousel">
              {hasImages ? (
                <>
                  <div className="modal-carousel-track" style={{ transform: `translateX(-${slideIndex * 100}%)` }}>
                    {images.map((src, i) => (
                      <img key={i} src={src} alt={`screenshot ${i + 1}`} className="modal-carousel-slide" />
                    ))}

    function ParticlesBackground() {
      const canvasRef = useRef(null);
      
      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let animId;
        
        const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        resize();
        window.addEventListener('resize', resize);
        
        const particles = Array.from({ length: 50 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          size: Math.random() * 2 + 0.5,
          opacity: Math.random() * 0.4 + 0.1
        }));
        
        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(56, 189, 248, ${p.opacity})`;
            ctx.fill();
          });
          
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 120) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(56, 189, 248, ${0.08 * (1 - dist / 120)})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
              }
            }
          }
          animId = requestAnimationFrame(animate);
        };
        animate();
        
        return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', resize); };
      }, []);
      
      return <canvas ref={canvasRef} className="particles-canvas" />;
    }

                    <i className={node.icon}></i>
                  </button>
                ))}
                
                <div className="dock-separator"></div>
              </div>
              
              <button 
                className="dock-btn" 
                onClick={() => setIsLightMode(!isLightMode)}
                data-label={isLightMode ? (lang === "fr" ? "Mode Sombre" : "Dark Mode") : (lang === "fr" ? "Mode Clair" : "Light Mode")}
              >
                <i className={isLightMode ? "fas fa-moon" : "fas fa-sun"}></i>
              </button>

              <button 
                className="dock-btn lang-toggle-btn" 
                onClick={() => setLang(lang === "fr" ? "en" : "fr")}
                data-label={lang === "fr" ? "English version" : "Version Française"}
              >
                {lang === "fr" ? "EN" : "FR"}
              </button>
            </nav>
          </div>

          <div className="progress-dots">
            {NAVIGATION_SCHEMA.map((node) => (
              <div
                key={node.id}
                className={`progress-dot ${currentSlide === node.id ? "is-active" : ""}`}
                onClick={() => navigateToSlide(node.id)}
                title={node.label[lang]}
              />
            ))}
          </div>

          <ProjectModal
            project={selectedProject}
            onClose={() => setSelectedProject(null)}
            isLightMode={isLightMode}
            lang={lang}
          />
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
